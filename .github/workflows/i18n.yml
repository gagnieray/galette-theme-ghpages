name: Regenerate i18n

# Weblate translates i18n/strings/*.yml and opens a pull request. The Liquid the
# theme actually ships is generated from those files, so something has to run
# bin/build-i18n once the translations land. The Execute script add-on is not
# available on hosted.weblate.org, so this does it here.
#
# Only paths that can change the output trigger it, so an ordinary commit does
# not pay for a run.
on:
  push:
    branches: [main]
    paths:
      - 'i18n/strings/**'
      - 'i18n/languages.yml'
      - 'bin/build-i18n'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    name: Regenerate the i18n includes

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Regenerate
        run: ./bin/build-i18n

      - name: Commit if the output changed
        run: |
          if git diff --quiet -- _includes/i18n.html _includes/lang-name.html; then
            echo "The includes already match i18n/strings/*.yml, nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _includes/i18n.html _includes/lang-name.html
          git commit -m 'Regenerate the i18n includes' \
                     -m 'Generated by bin/build-i18n from i18n/strings/*.yml.'
          # This commit touches only _includes/, which no path filter above
          # matches, and a GITHUB_TOKEN push does not start workflows anyway —
          # so it cannot loop.
          git push
