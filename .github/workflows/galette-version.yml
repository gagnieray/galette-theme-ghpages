name: Refresh the Galette version

# A plugin page says whether its stable download is compatible with the Galette
# anyone would install today. Which Galette that is changes when *Galette*
# releases — not when a plugin does — so nothing in a plugin repository would
# ever notice. This watches galette/galette instead, and the value it writes is
# an _includes file, which `remote_theme` shares with every consuming site.
#
# Daily rather than on a release event: this repository sees nothing of
# galette/galette's releases, and a webhook between the two would be one more
# thing to keep configured for a value that moves once or twice a year.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/refresh-galette-version'

permissions:
  contents: write

concurrency:
  group: galette-version
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Read the current Galette version

    steps:
      - uses: actions/checkout@v5

      - name: Refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/refresh-galette-version

      - name: Commit if the value changed
        run: |
          if git diff --quiet -- _includes/galette-version.html; then
            echo "The include already names the current Galette, nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _includes/galette-version.html
          git commit -m 'Name the current Galette version' \
                     -m 'Generated by bin/refresh-galette-version from the latest release of galette/galette.'
          # Touches only _includes/, which the path filter above does not match,
          # and a GITHUB_TOKEN push starts no workflow anyway — so it cannot
          # loop. Which is also why the consuming sites are rebuilt by chaining
          # off this run rather than by its push: see rebuild-consumers.yml.
          git push
