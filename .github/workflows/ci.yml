name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build the demo site

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The Liquid the theme ships is generated from the YAML Weblate owns, and
      # committed. Weblate's pull requests touch only i18n/strings/*.yml, so the
      # includes are stale until the Regenerate i18n workflow runs on main after
      # the merge — expected, hence a warning rather than a failure. On a human
      # pull request it is the reminder to run bin/build-i18n.
      - name: Check the generated i18n includes match i18n/strings/*.yml
        run: |
          ./bin/build-i18n --check \
            || echo "::warning file=_includes/i18n.html::Out of date with i18n/strings/*.yml. Run ./bin/build-i18n, or let the Regenerate i18n workflow do it once this lands on main."

      # The demo site at the repository root exercises every layout, include and
      # stylesheet the theme ships, so a build failure here is a failure for
      # every site using the theme.
      - name: Build
        run: bundle exec jekyll build --trace

      - name: Check the pages the demo is expected to produce
        run: |
          for page in index.html demo.html fr/demo.html assets/css/style.css; do
            test -s "_site/$page" || { echo "missing or empty: _site/$page"; exit 1; }
          done

      - name: Check the stylesheet resolved its assets
        run: |
          grep -q 'ptsans-regular-webfont.woff2' _site/assets/css/style.css
          grep -q '#ffb619' _site/assets/css/style.css

      - name: Check the maintainer pill and the download cartouche rendered
        run: |
          grep -q 'maintainer-core' _site/index.html
          grep -q 'id="galette"' _site/index.html

      # Nothing below names a Galette version, on purpose. The verdict is a
      # comparison between _data/galette.yml and _includes/galette-version.html,
      # and bin/refresh-galette-version moves both when Galette releases —
      # asserting "1.2" here would have turned this job red on Galette's next
      # release rather than on a regression in the theme. Every expected value is
      # therefore read back from the file that produced it.
      - name: Check the compatibility verdict rendered
        run: |
          series=$(sed -nE 's/^series: "(.*)"$/\1/p' _data/galette.yml)
          test -n "$series"
          # The pill carries its icon inline, hence the wildcard between the
          # class and the number; matching the number alone would also match the
          # download button above it.
          grep -q "class=\"compat compat-ok\"[^>]*>.*${series}</span>" _site/index.html
          # Two pills, one per link. The character class matters: compat-icon
          # would otherwise count as a third.
          test "$(grep -o 'class="compat[ \"]' _site/index.html | wc -l)" = 2
          # The nightly link never gets a verdict, whatever the numbers say.
          grep -q 'class="compat">' _site/index.html

      # The state a plugin reaches by standing still while Galette moves on: same
      # fixture, rank dropped one below the current Galette's.
      - name: Check the outdated state turns the verdict red
        run: |
          rank=$(sed -nE 's/^rank: ([0-9]+)$/\1/p' _data/galette.yml)
          test -n "$rank"
          # One whole generation back, and the label derived from that same
          # number so the fixture is coherent: a plugin behind by a generation
          # names the older one, it does not name the current one in red.
          stale=$((rank - 1000))
          mkdir -p test/data-stale
          sed -E "s/^rank: .*/rank: ${stale}/; s/^series: .*/series: \"$((stale / 1000000)).$((stale / 1000 % 1000))\"/" \
            _data/galette.yml > test/data-stale/galette.yml
          cat test/data-stale/galette.yml
          bundle exec jekyll build --trace \
            --config _config.yml,test/_config-stale.yml -d _site-stale
          grep -q 'class="compat compat-stale"' _site-stale/index.html
          ! grep -q 'compat-ok' _site-stale/index.html
          # The title names the Galette it is behind, not the plugin's own target.
          version=$(sed -nE 's/.*galette_version = "([^"]+)".*/\1/p' _includes/galette-version.html)
          test -n "$version"
          grep -q "title=\"[^\"]*(${version})" _site-stale/index.html

      # And the third state: no _data at all, so `plugin.min_galette` from
      # _config.yml is shown — and shown without a verdict, because nothing read
      # or compared it. This is what a plugin still published by hand gets.
      - name: Check the unverified fallback renders without a verdict
        run: |
          min=$(sed -nE 's/^[[:space:]]+min_galette:[[:space:]]*"([^"]+)".*/\1/p' _config.yml | head -n1)
          test -n "$min"
          bundle exec jekyll build --trace \
            --config _config.yml,test/_config-nodata.yml -d _site-nodata
          grep -q ">Compatible Galette ${min}</span>" _site-nodata/index.html
          ! grep -q 'compat-ok\|compat-stale' _site-nodata/index.html

      # The classifier itself runs in the browser, so what CI can check is that
      # the page carries the word lists and the styles they key on — and that no
      # `:has()` rule crept back in to draw the box, since `:first-child` counts
      # elements and would box any quotation with bold text in the middle.
      - name: Check blockquote admonitions are wired
        run: |
          grep -q "'admonition-'" _site/demo.html
          grep -q 'blockquote.admonition' _site/assets/css/style.css
          ! grep -oE 'blockquote:has\([^)]*\) *\{' _site/assets/css/style.css
          test "$(grep -o '<blockquote>' _site/demo.html | wc -l)" -ge 5

      - name: Check the language picker links the translated page
        run: |
          grep -q 'details class="langpicker"' _site/demo.html
          grep -q 'hreflang="fr"' _site/demo.html

      - name: Check right-to-left support is wired
        run: grep -q 'bg-rtl.png' _site/assets/css/style.css

      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: _site
          retention-days: 7
