<script>
  /* Any container that ends up scrolling horizontally — a wide table wrapped in
     .table-wrapper, a long code block — must be reachable with the keyboard,
     otherwise its content is unreadable without a mouse (WCAG 2.1.1). Authors
     write plain Markdown, so the theme applies it here rather than asking every
     plugin to remember a tabindex. */
  (function () {
    var label = {{ t_scroll_label | default: 'Scrollable content' | jsonify }};
    function mark() {
      var nodes = document.querySelectorAll('#content .table-wrapper, #content pre');
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var scrolls = el.scrollWidth > el.clientWidth;
        if (scrolls && !el.hasAttribute('tabindex')) {
          el.setAttribute('tabindex', '0');
          el.setAttribute('role', 'region');
          el.setAttribute('aria-label', label);
        } else if (!scrolls && el.getAttribute('role') === 'region') {
          el.removeAttribute('tabindex');
          el.removeAttribute('role');
          el.removeAttribute('aria-label');
        }
      }
    }
    mark();
    window.addEventListener('resize', mark);
  })();

  /* Admonitions, written as a blockquote whose first word is bold:

       > **Warning** — check the usage policy of the provider you choose.

     Which is all an author writes. Liquid is out of the question in a page
     Weblate rewrites — a tag broken by a translation fails the whole build — and
     GitHub's own `> [!WARNING]` is a github.com renderer feature that kramdown,
     which is what builds these pages, leaves as the literal text `[!WARNING]`.

     The type comes from that bold word, matched against every language the theme
     knows, because the word is part of the translated paragraph: the French pages
     already say `**Avertissement**`. A word no catalogue lists still gets a box,
     just a neutral one, so a translation nobody anticipated degrades rather than
     breaks. The box itself needs no JavaScript — CSS `:has()` draws it — and this
     only adds the colour. */
  (function () {
    var types = [
      ['warning', {{ adm_warning_words | jsonify }}],
      ['note', {{ adm_note_words | jsonify }}],
      ['todo', {{ adm_todo_words | jsonify }}]
    ];
    var quotes = document.querySelectorAll('#content blockquote');
    for (var i = 0; i < quotes.length; i++) {
      var quote = quotes[i];
      var para = quote.querySelector('p');
      if (!para) continue;
      /* The bold run has to open the paragraph: a quotation that merely happens
         to contain bold text is not an admonition. */
      var lead = para.firstChild;
      if (!lead || lead.nodeName !== 'STRONG') continue;
      quote.classList.add('admonition');
      var word = lead.textContent.trim().toLowerCase().replace(/[\s:.!?—–-]+$/, '');
      for (var t = 0; t < types.length; t++) {
        if (types[t][1].indexOf(word) !== -1) {
          quote.classList.add('admonition-' + types[t][0]);
          break;
        }
      }
    }
  })();

  /* The language picker is a <details>, so it already opens, closes and takes
     the keyboard on its own. This only adds what <details> does not do:
     dismissing it with Escape or a click elsewhere. */
  (function () {
    var picker = document.querySelector('.langpicker');
    if (!picker) return;
    document.addEventListener('click', function (event) {
      if (picker.open && !picker.contains(event.target)) picker.open = false;
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && picker.open) {
        picker.open = false;
        var summary = picker.querySelector('summary');
        if (summary) summary.focus();
      }
    });
  })();
</script>
